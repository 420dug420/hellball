# After every change to index.html, make sure it still loads online.js (1V1 ONLINE + KING OF THE HILL).
# If a pasted-in index.html dropped the line, this puts it back and pushes the fix (about a minute).
name: Keep online modes
on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keep-online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the online.js line back if it is missing
        run: python3 .github/scripts/keep_online.py
      - name: Commit the fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -am "Auto-fix: index.html must load online.js (1v1 + King of the Hill)"
          git push
