<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELLBALL</title>
<style>
html,body{margin:0;height:100%;background:#020804;color:#33ff77;font-family:"Courier New",monospace;overflow:hidden}
#hud{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;border-bottom:1px solid #119944;letter-spacing:2px;font-size:14px}
#c{display:block;cursor:none;touch-action:none}
#msg{position:fixed;left:0;right:0;top:50%;text-align:center;font-size:24px;letter-spacing:4px;pointer-events:none;text-shadow:0 0 8px #33ff77}
#msg.low{top:auto;bottom:46px;font-size:18px}
#msg small{display:block;font-size:13px;color:#119944;margin-top:10px;letter-spacing:2px}
#quote{position:fixed;left:16px;right:16px;top:100px;text-align:center;font-size:14px;letter-spacing:3px;color:#ffb000;pointer-events:none;opacity:0;transition:opacity .9s;text-shadow:0 0 8px rgba(255,176,0,.7);font-style:italic}
#flash{position:fixed;left:0;right:0;top:64px;text-align:center;font-size:18px;letter-spacing:6px;pointer-events:none;opacity:0;transition:opacity .25s;text-shadow:0 0 10px currentColor}

#fbtn{background:transparent;border:1px solid #119944;color:#33ff77;font-family:"Courier New",monospace;font-size:11px;letter-spacing:2px;padding:3px 9px;cursor:pointer;border-radius:2px;margin-left:6px}
#fbtn.on{color:#ffb000;border-color:#ffb000;text-shadow:0 0 6px #ffb000}
#mbtn:hover{border-color:#33ff77;text-shadow:0 0 6px #33ff77}

#modesel{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(2,8,4,.9);z-index:50}
#modesel.hidden{display:none}
.msTitle{font-size:20px;letter-spacing:6px;color:#33ff77;text-shadow:0 0 10px #33ff77}
.mBtn{background:transparent;border:1px solid #33ff77;color:#33ff77;font-family:"Courier New",monospace;font-size:16px;letter-spacing:3px;padding:14px 34px;cursor:pointer;min-width:260px}
.mBtn:hover{background:rgba(51,255,119,.08);text-shadow:0 0 8px #33ff77}
.mBtn small{display:block;font-size:10px;letter-spacing:1px;color:#119944;margin-top:6px;text-transform:none}
#mG{border-color:#ff4455;color:#ff4455}
#mG:hover{background:rgba(255,68,85,.08);text-shadow:0 0 8px #ff4455}

#mT:hover{background:rgba(51,214,255,.08);text-shadow:0 0 8px #33d6ff}
#mC{border-color:#ffb000;color:#ffb000}
#mC:hover{background:rgba(255,176,0,.08);text-shadow:0 0 8px #ffb000}
</style></head><body>
<div id="hud"><span style="color:#ff4455;text-shadow:0 0 8px #ff4455">HELLBALL <span style="color:#119944;text-shadow:none" id="np"></span></span><button id="mbtn" title="M">MUSIC: ON</button><button id="fbtn" title="force your songs to play (testing)">SONGS: AUTO</button><span id="s"></span></div>
<canvas id="c"></canvas><div id="msg"></div><div id="flash"></div><div id="quote"></div>
<div id="modesel"><div class="msTitle">SELECT MODE</div><button id="mN" class="mBtn">NORMAL</button><button id="mG" class="mBtn">GEF MODE<small>mutating paddles &middot; multiball volleys &middot; wall breaches</small></button><button id="mT" class="mBtn">TEST MODE<small>hold left-click to catch &amp; throw &middot; shift for corkscrew</small></button><button id="mC" class="mBtn">CLASSIC MODE<small>no effects &middot; only the AI gets faster</small></button></div>
<script src="discord-sdk.js"></script>
<script>
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),msg=document.getElementById("msg"),fl=document.getElementById("flash");
let W,H,A,cx,cy;const ASP=4/3;                                // the tunnel is 4:3, like the original
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight-40;A=Math.min(W/ASP,H)*0.47;cx=W/2;cy=H/2}
addEventListener("resize",rs);rs();
let MODE="normal";
const AI0=0.52,AIK=0.135,K=2.4,PH0=0.28,BR=0.07,SERVE_MIN=0.8,sc=z=>1/(1+K*z),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let F=1,Ft=1;                                                  // half-size of the play field (1 = the tunnel)
const P=(x,y,z)=>[cx+x*ASP*(A/F)*sc(z),cy+y*(A/F)*sc(z)];
/* ---------- sound (off unless enabled in Fatalix; M toggles) ---------- */
let AC=null,mute=false;try{mute=localStorage.getItem("cb_sfx")==="off"}catch(e){}
function tn(f,d,t,v,sl){if(mute)return;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t||"sine";o.frequency.setValueAtTime(f,n);
  if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v||.05,n+.01);
  g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
function sfxCtx(){if(mute)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}catch(e){return null}}
function tink(hot){                                             // little terminal "tink" when the ball meets a paddle
  const a=sfxCtx();if(!a)return;const n=a.currentTime,g=a.createGain(),lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=6000;
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(hot?.09:.07,n+.002);g.gain.exponentialRampToValueAtTime(.0001,n+(hot?.16:.09));
  [[hot?2637:2093,"square"],[hot?3951:3136,"sine"]].forEach(([f,ty])=>{const o=a.createOscillator();o.type=ty;o.frequency.setValueAtTime(f,n);
    if(hot)o.frequency.exponentialRampToValueAtTime(f*1.5,n+.12);o.connect(lp);o.start(n);o.stop(n+.2)});
  lp.connect(g);g.connect(a.destination)}
function bounceSnd(){                                           // rubbery ball-off-the-wall thock
  const a=sfxCtx();if(!a)return;const n=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type="sine";o.frequency.setValueAtTime(320,n);o.frequency.exponentialRampToValueAtTime(85,n+.13);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.16,n+.004);g.gain.exponentialRampToValueAtTime(.0001,n+.16);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+.18);
  const b=a.createBuffer(1,Math.floor(a.sampleRate*.03),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const src=a.createBufferSource(),lp=a.createBiquadFilter(),g2=a.createGain();lp.type="lowpass";lp.frequency.value=1400;g2.gain.value=.08;
  src.buffer=b;src.connect(lp);lp.connect(g2);g2.connect(a.destination);src.start(n)}
let glitchOn=true;
/* ---------- soundtrack: technoir synth-pop. N music on/off, B next track ---------- */
let musicOn=true;try{musicOn=localStorage.getItem("cb_music")!=="off"}catch(e){}
const mf=m=>440*Math.pow(2,(m-69)/12),MINOR=[0,2,3,5,7,8,10],MAJOR=[0,2,4,5,7,9,11];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SONGS=[
 {name:"NEON CONFESSION",bpm:108,scale:MINOR,key:57,prog:[[57,"m"],[53,"M"],[60,"M"],[55,"M"]],
  kick:"x...x...x...x...",snare:"....x.......x...",hat:"..o...o...o...o.",bass:"0.0c0.0c0.0c0.0c",arp:"0120120120120121",lead:"saw",seed:11,dens:.36},
 {name:"CHROME RAIN",bpm:96,scale:MINOR,key:50,prog:[[50,"m"],[46,"M"],[55,"m"],[57,"M"]],
  kick:"x.....x...x.....",snare:"....x.......x..x",hat:"xxxxxxxxxxxxxxxx",bass:"0000000000000000",arp:"0..1..2..1..0..2",lead:"square",seed:23,dens:.3},
 {name:"MIDNIGHT ARITHMETIC",bpm:116,scale:MINOR,key:52,prog:[[52,"m"],[48,"M"],[55,"M"],[50,"M"],[52,"m"],[48,"M"],[57,"m"],[59,"M"]],
  kick:"x...x...x...x...",snare:"....c.......c...",hat:"x.x.x.x.x.x.x.x.",bass:"0..0..0.0..c..0.",arp:"0102010201020102",lead:"saw",seed:37,dens:.44}];
const SECRET={name:"HAPPYMEAT",bpm:152,scale:MAJOR,key:62,prog:[[62,"M"],[57,"M"],[59,"m"],[55,"M"],[55,"M"],[57,"M"],[62,"M"],[62,"M"]],
  lens:[16,16,16,14,16,16,14,16],kick:"x.x.x.x.x.x.x.x.",snare:"....x.......x...",hat:".x.x.x.x.x.x.x.x",bass:"0c0c0c0c0c0c0c0c",arp:"0120120120120120",lead:"bright",seed:7,dens:.6,happy:1};
const MU={out:null,del:null,rev:null,noise:null,timer:0,next:0,si:Math.floor(Math.random()*3),secret:false,bar:0,s:0,mel:null,bright:0,warp:0};
const SONG=()=>MU.secret?SECRET:SONGS[MU.si],SD=()=>60/SONG().bpm/4;
/* ---------- YOUR OWN MUSIC ----------
   Put audio files (mp3/ogg/wav) in a "music" folder next to this page and list them here, e.g.
     {name:"My Song",file:"music/my-song.mp3"}
   If this list is empty the built-in synth soundtrack plays. */
const TRACKS=[
  {name:"LIGHT",file:"music/light.ogg"},
  {name:"SEWNT",file:"music/sewnt.ogg"},
  {name:"VON",file:"music/von.ogg"},
];
const SONG_FROM_LEVEL=15,RARE0=.30,RARE_STEP=.05,RARE_MAX=.80,SONG_VOL=.3;   // synth is the normal soundtrack; from level 16 your songs get a 30% chance at each song change, +5% per level, up to 80%
let cMode=false,cForce=false;                  // cMode: custom songs are the current music; cForce: the SONGS button, always your songs (testing)
const rareChance=()=>st.level<SONG_FROM_LEVEL?0:Math.min(RARE_MAX,RARE0+RARE_STEP*(st.level-SONG_FROM_LEVEL));   // level 16 = 30%, 17 = 35% ... 26+ = 80%
const pickCustom=()=>cForce||Math.random()<rareChance();
const CUSTOM=()=>TRACKS.length>0&&!MU.secret&&cMode;
let ci=Math.floor(Math.random()*Math.max(1,TRACKS.length)),ca=null,cg=null,csrc=null,cOn=false;
/* ---------- audio analysis: visual beat matching + the level 16+ visualizer ---------- */
let an=null,FD=null;const MB={v:0,avg:0,last:0},KQ=[];             // MB.v = beat pulse (1 on a beat, fades out); KQ = scheduled synth kick times
function anLink(){
  if(!AC)return;
  if(!an){an=AC.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.4;an.minDecibels=-85;an.maxDecibels=-20;FD=new Uint8Array(an.frequencyBinCount)}
  if(MU.out&&!an._m){MU.out.connect(an);an._m=1}
  if(csrc&&!an._c){csrc.connect(an);an._c=1}}                       // tapped before the volume control, so quiet songs still move the bars
function audioFrame(t,dt){
  MB.v=Math.max(0,MB.v-dt*5);
  if(!MU.timer)KQ.length=0;
  else if(AC)while(KQ.length&&KQ[0]<=AC.currentTime){KQ.shift();MB.v=1}   // synth: the kick drum schedule is the beat
  if(an&&AC.state==="running"){an.getByteFrequencyData(FD);
    if(cOn){let e=0;for(let i=1;i<=5;i++)e+=FD[i];e/=5*255;           // your songs: bass-energy onset detection
      MB.avg=MB.avg*.94+e*.06;if(e>MB.avg*1.2&&e>.22&&t-MB.last>.17){MB.v=1;MB.last=t}}}}
function cInit(){
  if(ca)return true;
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return false}
  ca=new Audio();ca.preload="auto";ca.crossOrigin="anonymous";
  cg=AC.createGain();cg.gain.value=0;csrc=AC.createMediaElementSource(ca);csrc.connect(cg);cg.connect(AC.destination);anLink();
  ca.addEventListener("ended",()=>{if(cOn)cAdvance()});
  ca.addEventListener("error",()=>{if(cOn&&TRACKS.length>1){ci=(ci+1)%TRACKS.length;cLoad()}});
  return true}
function cAdvance(){                                                // a track finished: pick what plays next
  ci=(ci+1)%TRACKS.length;if(pickCustom())cLoad();else{cMode=false;musicStop();musicStart()}}
function cSwitch(toCustom){cMode=toCustom;musicStop();musicStart()}
function fbtnSync(){const b=document.getElementById("fbtn");b.textContent="SONGS: "+(cForce?"FORCED":"AUTO");b.classList.toggle("on",cForce)}
document.getElementById("fbtn").addEventListener("click",()=>{cForce=!cForce;fbtnSync();if(!TRACKS.length){flash("NO SONGS LOADED","#ff4455");return}
  musicOn=true;try{localStorage.setItem("cb_music","on")}catch(_){}mbtnSync();
  if(cForce){cSwitch(true);flash("YOUR SONGS FORCED","#ffb000")}else{if(st.level<SONG_FROM_LEVEL&&cMode)cSwitch(false);flash("SONGS: AUTO (RARE AFTER LEVEL "+SONG_FROM_LEVEL+")","#ffb000")}});
function cLoad(){if(!ca||!TRACKS.length)return;ca.src=TRACKS[ci].file;ca.load();if(cOn)ca.play().catch(()=>{});np()}
function customStart(){
  if(!cInit())return;if(AC.state==="suspended")AC.resume();
  if(!ca.src)cLoad();cOn=true;ca.play().catch(()=>{});
  const n=AC.currentTime;cg.gain.cancelScheduledValues(n);cg.gain.setValueAtTime(cg.gain.value,n);cg.gain.linearRampToValueAtTime(SONG_VOL,n+1);np()}
function customStop(){
  if(!cOn||!ca)return;cOn=false;const n=AC.currentTime;cg.gain.cancelScheduledValues(n);cg.gain.setValueAtTime(cg.gain.value,n);cg.gain.linearRampToValueAtTime(0,n+.4);
  setTimeout(()=>{if(!cOn)ca.pause()},450)}

function musicInit(){
  if(MU.out)return true;
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return false}
  const a=AC,out=a.createGain();out.gain.value=0;
  const comp=a.createDynamicsCompressor?a.createDynamicsCompressor():a.createGain();out.connect(comp);comp.connect(a.destination);
  const del=a.createDelay(2),fb=a.createGain(),dl=a.createBiquadFilter();
  del.delayTime.value=SD()*3;fb.gain.value=.35;dl.type="lowpass";dl.frequency.value=2600;del.connect(dl);dl.connect(fb);fb.connect(del);dl.connect(out);
  const rv=a.createConvolver(),len=Math.floor(a.sampleRate*2.6),buf=a.createBuffer(2,len,a.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2)}
  rv.buffer=buf;const rg=a.createGain();rg.gain.value=.3;rv.connect(rg);rg.connect(out);
  const nb=a.createBuffer(1,a.sampleRate,a.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  MU.out=out;MU.del=del;MU.rev=rv;MU.noise=nb;anLink();return true}
function env(g,t,peak,att,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec)}
function osc(type,f,t,d,dst,det){const o=AC.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=(det||0)+(MU.warp?(Math.random()-.5)*MU.warp:0);o.connect(dst);o.start(t);o.stop(t+d);return o}
function noiseHit(t,dur,type,freq,gain,dst,gate,q){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=MU.noise;f.type=type;f.frequency.value=freq;f.Q.value=q||.8;
  if(gate){g.gain.setValueAtTime(gain,t);g.gain.setValueAtTime(gain*.75,t+dur*.85);g.gain.linearRampToValueAtTime(.0001,t+dur)}else env(g,t,gain,.002,dur);
  s.connect(f);f.connect(g);g.connect(dst||MU.out);s.start(t,Math.random()*.5);s.stop(t+dur+.05);return g}
function dKick(t){KQ.push(t);if(KQ.length>64)KQ.shift();const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.11);
  env(g,t,.5,.003,.3);o.connect(g);g.connect(MU.out);o.start(t);o.stop(t+.36);noiseHit(t,.012,"highpass",3000,.08)}
function dSnare(t){const g=noiseHit(t,.22,"bandpass",1900,.2,MU.out,true);g.connect(MU.rev);                // gated 80s snare
  const h=AC.createGain();env(h,t,.12,.002,.12);osc("triangle",185,t,.15,h);h.connect(MU.out)}
function dClap(t){for(let k=0;k<3;k++)noiseHit(t+k*.011,.02,"bandpass",1200,.14);const g=noiseHit(t+.033,.16,"bandpass",1100,.1);g.connect(MU.rev)}
function dHat(t,open){noiseHit(t,open?.16:.035,"highpass",8000,open?.05:.045)}
function vBass(m,t,d){const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type="lowpass";lp.Q.value=8;
  lp.frequency.setValueAtTime(300+1400*MU.bright,t);lp.frequency.exponentialRampToValueAtTime(160,t+.18);
  env(g,t,.15,.005,Math.max(.08,d*.9));osc("sawtooth",mf(m),t,d+.1,lp);osc("square",mf(m),t,d+.1,lp,-12);lp.connect(g);g.connect(MU.out);
  const sg=AC.createGain();env(sg,t,.09,.005,Math.max(.08,d*.9));osc("sine",mf(m-12),t,d+.1,sg);sg.connect(MU.out)}
function vPad(ms,t,d){const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type="lowpass";lp.Q.value=2;
  lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(900+1400*MU.bright,t+d*.5);lp.frequency.linearRampToValueAtTime(480,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.022,t+d*.25);g.gain.linearRampToValueAtTime(0,t+d+.3);
  ms.forEach(m=>[-10,10].forEach(dt=>osc("sawtooth",mf(m),t,d+.4,lp,dt)));lp.connect(g);g.connect(MU.out);g.connect(MU.rev)}
function vArp(m,t,bright){const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=bright?5000:2600;
  env(g,t,.032,.003,.12);osc("square",mf(m),t,.16,lp);lp.connect(g);g.connect(MU.out);g.connect(MU.del)}
function vLead(m,t,d,kind){const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=kind==="bright"?5200:3000;
  const a=osc(kind==="square"||kind==="bright"?"square":"sawtooth",mf(m),t,d+.15,lp),b=osc("sawtooth",mf(m),t,d+.15,lp,7);
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=5.2;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(kind==="bright"?8:14,t+Math.min(.4,d));
  lfo.connect(lg);lg.connect(a.detune);lg.connect(b.detune);lfo.start(t);lfo.stop(t+d+.15);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.042,t+.012);g.gain.setValueAtTime(.042,t+d*.8);g.gain.linearRampToValueAtTime(0,t+d+.08);
  lp.connect(g);g.connect(MU.out);g.connect(MU.del);g.connect(MU.rev)}
function nearTone(n,root,tones){let best=n,bd=99;for(let o=-2;o<=3;o++)for(const x of tones){const c=root+x+12*o,dd=Math.abs(c-n);if(dd<bd){bd=dd;best=c}}return best}
function melody(S){                                                  // original melodies, generated from each song's seed (phrase A, then A')
  const r=rng(S.seed),nb=Math.max(8,S.prog.length),out=[];let deg=7;
  const bar=(b,motif)=>{const bl=S.lens?S.lens[b%S.lens.length]:16,[root,q]=S.prog[b%S.prog.length],tones=q==="m"?[0,3,7]:[0,4,7],ons=motif.filter(x=>x<bl),notes=[];
    ons.forEach((s,i)=>{const nx=i+1<ons.length?ons[i+1]:bl;deg=clamp(deg+Math.round((r()-.5)*4),2,12);
      let n=S.key+S.scale[deg%7]+12*Math.floor(deg/7);if(s%4===0||i===ons.length-1)n=nearTone(n,root+12,tones);notes.push({s,n,len:Math.min(nx-s,6)})});return notes};
  const mk=()=>{const m=[];for(let s=0;s<16;s++)if(r()<(s%4===0?1.6:s%2===0?1:.5)*S.dens)m.push(s);return m.length?m:[0]};
  const A=mk(),B=mk(),C=mk();
  for(let b=0;b<nb;b++){const half=b>=nb/2,mo=b%2===0?A:(half&&b===nb-1?C:B);if(b===nb/2)deg=7;out.push(bar(b,mo))}
  return out}
function nextSong(silent){
  if(CUSTOM()){ci=(ci+1)%TRACKS.length;cLoad();np();if(!silent&&cOn)flash("NOW PLAYING: "+TRACKS[ci].name,"#33d6ff");return}
  if(!MU.secret)MU.si=(MU.si+1)%SONGS.length;MU.mel=null;MU.bar=0;MU.s=0;
  if(MU.del&&AC)MU.del.delayTime.setValueAtTime(SD()*3,AC.currentTime);np();if(!silent&&MU.timer)flash("NOW PLAYING: "+SONG().name,"#33d6ff")}
function np(){const e=document.getElementById("np");if(e)e.textContent=musicOn?"// ♪ "+(CUSTOM()?TRACKS[ci].name:SONG().name):""}
function unlockSecret(){MU.secret=true;MU.mel=null;MU.bar=0;MU.s=0;flash("SECRET TRACK UNLOCKED: HAPPYMEAT","#ff66cc");
  if(!musicOn){musicOn=true;try{localStorage.setItem("cb_music","on")}catch(_){}}
  customStop();
  if(MU.del&&AC)MU.del.delayTime.setValueAtTime(SD()*3,AC.currentTime);musicStart();np()}

/* ---------- the hit: one function for the player, the AI and the serve ---------- */
function aiTrick(){                                            // the AI sometimes goes for a trick shot
  if(Math.random()>Math.min(.45,.02+.045*lvl()))return "";
  return ["BENDER","SLICE","SMASH","DROP"][Math.floor(Math.random()*4)]}
function strike(who,dx,dy,pvx,pvy,serve,trick){
  const s=lvl(),hz=HZ(),hot=Math.abs(dx)<hz&&Math.abs(dy)<hz,dir=who==="p"?1:-1;
  const gain=2.1*(1+0.025*s)*(hot?1.8:1);
  const curl=()=>hot?(Math.random()<.5?-1:1)*(1.1+0.05*s):0;    // a centre hit always adds some curve
  ball.hits=serve?0:(ball.hits||0)+1;                            // speed comes from the level, not from compounding every hit
  const sp=baseSpeed()*(1+Math.min(.18,.02*ball.hits))*(serve?1+Math.min(.15,Math.hypot(pvx,pvy)*.03):1);
  ball.vz=dir*sp*(hot?1.12:1);
  ball.vx=(serve?0:ball.vx)+dx*1.2+(serve?clamp(pvx,-2,2)*.25:0);
  ball.vy=(serve?0:ball.vy)+dy*1.2+(serve?clamp(pvy,-2,2)*.25:0);
  ball.sx=clamp(pvx*gain+curl(),-7,7);ball.sy=clamp(pvy*gain+curl(),-7,7);
  ball.fooled=false;
  if(MODE==="classic"&&who==="p"){                               // CLASSIC: swing in an arc for a drastic curve
    const a=arc5(),bend=Math.hypot(a.dx,a.dy);
    ball.sx=clamp(a.ax*gain*.4+a.dx*.8+curl()*.5,-8,8);ball.sy=clamp(a.ay*gain*.4+a.dy*.8+curl()*.5,-8,8);   // the bend still counts double, overall roughly half as strong
    if(bend>4&&!serve)flash("ARC SHOT  +CURVE","#ffb000");
    ball.fooled=st.level<8&&(Math.abs(ball.vz)>=0.56||Math.hypot(ball.vx,ball.vy)>=1.8||Math.hypot(ball.sx,ball.sy)>=6.5)}   // really fast ball, before level 9
  ball.z=who==="p"?0.0:1;
  ball.cork=who==="p"&&phased()?{R:.16*F,w:(pvx>=0?1:-1)*12,ph:0}:null;   // corkscrew: the ball spirals around its path
  rings.push({x:ball.x,y:ball.y,z:ball.z,t:0,hot});
  if(trick){
    const sg=Math.random()<.5?-1:1,sg2=Math.random()<.5?-1:1;
    if(trick==="BENDER"){ball.vx+=sg*1.3;ball.sx=-sg*5.5;ball.vy+=(Math.random()-.5)*1.2}   // starts one way, bends the other
    else if(trick==="SLICE"){ball.sx=sg*5.5;ball.sy=sg2*5.5}
    else if(trick==="SMASH"){ball.vz=-Math.min(1.25,Math.abs(ball.vz)*1.3);ball.sx*=.3;ball.sy*=.3}
    else if(trick==="DROP"){ball.vz*=.7;ball.sx=sg*5;ball.sy=sg2*4}
    flash("AI TRICK SHOT: "+trick,"#ff4455");tn(300,.2,"sawtooth",.06,900)}
  else if(hot){flash((who==="p"?"SWEET SPOT":"AI SWEET SPOT")+"  +CURVE +SPEED",who==="p"?"#ffb000":"#ff4455")}
  tink(hot);if(hot)pulse("rgba(255,176,0,.35)");
  if(MODE==="test"&&who==="p"&&hot&&!serve)stamina=Math.min(1,stamina+.75);
  if(ball.cork){flash("CORKSCREW","#33d6ff");tn(1400,.18,"sine",.04,500)}
  if(who==="p"){ai.off=[(Math.random()*2-1)*aimErr(),(Math.random()*2-1)*aimErr()];planAI();if(!serve)PSY.rally++}
  spawnDecoys()}

  rings.forEach(g=>{const p=P(g.x,g.y,g.z),k=g.t/.5;ctx.strokeStyle=(g.hot?"rgba(255,176,0,":"rgba(51,255,119,")+(1-k)+")";ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],BR*(A/F)*sc(g.z)*(1+k*(g.hot?5:3)),0,7);ctx.stroke()});
  ctx.restore();                                                   // end of the play field layer
  ctx.restore();
  if(lvl()>=34){invT-=dt;if(invT<=0){invA=.9;invT=5+Math.random()*8}}   // 35+: the colours invert without warning
  if(invA>0.02){ctx.save();ctx.globalCompositeOperation="difference";ctx.fillStyle="rgba(255,255,255,"+invA+")";ctx.fillRect(0,0,W,H);ctx.restore();invA=Math.max(0,invA-dt*2.5)}
  if(flashA>0.01){ctx.fillStyle="rgba(255,255,255,"+flashA*.55+")";ctx.fillRect(0,0,W,H)}
  const ins=insane();                                              // glitch: shifted slices of the screen
  if(ins>0&&glitchOn&&(frameN++%2===0)){
    const n=2+Math.floor(ins*5);
    for(let i=0;i<n;i++){const y=Math.random()*H,h=4+Math.random()*28*ins,dx=(Math.random()-.5)*70*ins;ctx.drawImage(cv,0,y,W,h,dx,y,W,h)}}
  if(MODE==="gef")drawGefGlitches(t);
  if(MODE!=="classic"&&MB.v>.05){ctx.save();ctx.globalAlpha=MB.v*.16;ctx.strokeStyle="#33ff77";ctx.lineWidth=16;ctx.strokeRect(0,0,W,H);ctx.restore()}   // beat flash on the screen edge
  if(MODE==="test")drawStamina(t);
  if(MODE!=="classic")psyHud(t)}
function drawStamina(t){                                          // TEST MODE: small stamina meter, bottom-centre
  const w=250,h=9,x=(W-w)/2,y=H-34,low=stamina<.25,blink=Math.floor(t*8)%2===0;
  ctx.save();ctx.globalCompositeOperation="source-over";ctx.globalAlpha=.85;
  ctx.fillStyle="rgba(0,16,6,.5)";ctx.fillRect(x-6,y-5,w+12,h+22);
  ctx.strokeStyle="rgba(51,214,255,.45)";ctx.lineWidth=1;ctx.strokeRect(x-6,y-5,w+12,h+22);
  ctx.fillStyle=low?(blink?"#ff4455":"#5a0008"):"#33d6ff";ctx.fillRect(x,y,w*stamina,h);
  ctx.strokeStyle="rgba(191,255,213,.35)";ctx.strokeRect(x,y,w,h);
  ctx.font="9px Courier New";ctx.textAlign="center";ctx.fillStyle="rgba(51,214,255,.9)";
  ctx.fillText("STAMINA "+Math.round(stamina*100)+(ball.caught?"  //  CAUGHT - RELEASE TO THROW":held&&stamina>.05?"  //  CATCH READY":"")+(shiftHeld?"  //  CORKSCREW ARMED":""),x+w/2,y+h+11);
  ctx.restore()}
let last=performance.now(),frameAll=0;
let errCount=0;
function frame(t){
  requestAnimationFrame(frame);                                  // always reschedule first: one bad frame must never kill the loop
  frameAll++;let dt=(t-last)/1000;last=t;if(!(dt>0))dt=0.016;dt=Math.min(0.033,dt);   // never negative / NaN after tab-away
  ctx.save();
  try{step(dt);draw(t/1000,dt)}
  catch(e){errCount++;if(errCount<4)console.warn("HELLBALL frame error",e);
    try{if(![ball.x,ball.y,ball.z,ball.vx,ball.vy,ball.vz,pad.x,pad.y].every(Number.isFinite)){pad.x=pad.tx=pad.y=pad.ty=0;toServe()}}catch(_){}}
  finally{ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";ctx.shadowBlur=0;ctx.setLineDash&&ctx.setLineDash([])}}
document.addEventListener("visibilitychange",()=>{last=performance.now()});
addEventListener("focus",()=>{last=performance.now()});
reset();hud();
requestAnimationFrame(frame);
