<script>
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),msg=document.getElementById("msg"),fl=document.getElementById("flash");
let W,H,A,cx,cy;const ASP=4/3;                                // the tunnel is 4:3, like the original
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight-(innerWidth<=900&&innerHeight<=560?34:40);A=Math.min(W/ASP,H)*0.47;cx=W/2;cy=H/2}
addEventListener("resize",rs);rs();
let MODE="normal";
/* ---------- profile & stats: saved on this device (browser storage) ---------- */
const SVK="hb_profile_v1";
const SV=Object.assign({games:0,total:0,best:0,bestLevel:1,bestAce:0,bestVolley:0,bestSweet:0,fastest:0,aces:0,breakSec:0,daily:{d:"",best:0}},(()=>{try{return JSON.parse(localStorage.getItem(SVK))||{}}catch(e){return{}}})());
function svSave(){try{localStorage.setItem(SVK,JSON.stringify(SV))}catch(e){}}
const RUN={ace:0,sweet:0,vol:0,spd:0,brk:0,bestAce:0,bestVol:0,bestSweet:0};     // this run (ace/sweet = current streaks; vol/spd = this point)
let svT=0;
const dayKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const DAILY_ERA=(()=>{const k=dayKey();let h=2166136261;for(let i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619)}return 1+((h>>>0)%4)})();   // today's fractal morph: one of the four late-game substrates
const dailyBest=()=>SV.daily&&SV.daily.d===dayKey()?SV.daily.best:0;
const plvlOf=t=>Math.floor(Math.sqrt(Math.max(0,t)/1500))+1;                      // player level from lifetime points
const fmtT=s=>Math.floor(s/60)+"M "+String(Math.floor(s%60)).padStart(2,"0")+"S";
function updPL(){const e=document.getElementById("pl");if(e)e.textContent="// PLAYER LVL "+plvlOf(SV.total)}
function profInit(){
  const pl=plvlOf(SV.total),lo=1500*(pl-1)*(pl-1),hi=1500*pl*pl,pc=Math.max(0,Math.min(99,Math.round(100*(SV.total-lo)/(hi-lo)))),k=Math.round(pc/10);
  document.getElementById("mDs").innerHTML="TODAY: "+ERAS[DAILY_ERA%5]+" SUBSTRATE &middot; BEST TODAY "+dailyBest();
  document.getElementById("prof").innerHTML="PLAYER LVL "+pl+" ["+"#".repeat(k)+"-".repeat(10-k)+"] "+pc+"%<br>BEST SCORE "+SV.best+" // BEST LEVEL "+SV.bestLevel+" // GAMES "+SV.games+
    "<br>ACE STREAK "+SV.bestAce+" // LONGEST VOLLEY "+SV.bestVolley+" // SWEET CHAIN "+SV.bestSweet+"<br>TIME IN BREAKDOWN "+fmtT(SV.breakSec);
  updPL()}
function endRun(lv){                                              // game over: bank the run, return a summary for the game-over screen
  const nb=st.score>SV.best&&st.score>0;
  SV.games++;if(st.score>SV.best)SV.best=st.score;if(1+lv>SV.bestLevel)SV.bestLevel=1+lv;
  let dn=false;if(MODE==="daily"){if(SV.daily.d!==dayKey())SV.daily={d:dayKey(),best:0};if(st.score>SV.daily.best){SV.daily.best=st.score;dn=true}}
  svSave();profInit();
  const out="<br>ACE STREAK "+RUN.bestAce+"   LONGEST VOLLEY "+RUN.bestVol+"   SWEET CHAIN "+RUN.bestSweet+(RUN.brk>.5?"   TIME IN BREAKDOWN "+fmtT(RUN.brk):"")+
    "<br>PLAYER LVL "+plvlOf(SV.total)+(nb?"   //   NEW PERSONAL BEST":"")+(dn?"   //   NEW DAILY BEST":"");
  RUN.ace=RUN.sweet=RUN.vol=RUN.spd=RUN.brk=RUN.bestAce=RUN.bestVol=RUN.bestSweet=0;return out}
addEventListener("pagehide",svSave);document.addEventListener("visibilitychange",()=>{if(document.hidden)svSave()});
let tHeld=false;                                                  // hidden: hold T while clicking GEF MODE to enter test mode
addEventListener("keydown",e=>{if(e.key==="t"||e.key==="T")tHeld=true});addEventListener("keyup",e=>{if(e.key==="t"||e.key==="T")tHeld=false});addEventListener("blur",()=>{tHeld=false});

const AI0=0.52,AIK=0.135,K=2.4,PH0=0.28,BR=0.07,SERVE_MIN=0.8,sc=z=>1/(1+K*z),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let F=1,Ft=1;                                                  // half-size of the play field (1 = the tunnel)
const P=(x,y,z)=>[cx+x*ASP*(A/F)*sc(z),cy+y*(A/F)*sc(z)];
/* ---------- sound (off unless enabled in Fatalix; M toggles) ---------- */
let AC=null,mute=false;try{mute=localStorage.getItem("cb_sfx")==="off"}catch(e){}
function tn(f,d,t,v,sl){if(mute)return;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t||"sine";o.frequency.setValueAtTime(f,n);
  if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v||.05,n+.01);
  g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
function sfxCtx(){if(mute)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}catch(e){return null}}
function tink(hot){                                             // little terminal "tink" when the ball meets a paddle
  const a=sfxCtx();if(!a)return;const n=a.currentTime,g=a.createGain(),lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=6000;
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(hot?.09:.07,n+.002);g.gain.exponentialRampToValueAtTime(.0001,n+(hot?.16:.09));
  [[hot?2637:2093,"square"],[hot?3951:3136,"sine"]].forEach(([f,ty])=>{const o=a.createOscillator();o.type=ty;o.frequency.setValueAtTime(f,n);
    if(hot)o.frequency.exponentialRampToValueAtTime(f*1.5,n+.12);o.connect(lp);o.start(n);o.stop(n+.2)});
  lp.connect(g);g.connect(a.destination)}
function bounceSnd(){                                           // rubbery ball-off-the-wall thock
  const a=sfxCtx();if(!a)return;const n=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type="sine";o.frequency.setValueAtTime(320,n);o.frequency.exponentialRampToValueAtTime(85,n+.13);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.16,n+.004);g.gain.exponentialRampToValueAtTime(.0001,n+.16);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+.18);
  const b=a.createBuffer(1,Math.floor(a.sampleRate*.03),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const src=a.createBufferSource(),lp=a.createBiquadFilter(),g2=a.createGain();lp.type="lowpass";lp.frequency.value=1400;g2.gain.value=.08;
  src.buffer=b;src.connect(lp);lp.connect(g2);g2.connect(a.destination);src.start(n)}
let glitchOn=true;
/* ---------- soundtrack: technoir synth-pop. N music on/off, B next track ---------- */
let musicOn=true;try{musicOn=localStorage.getItem("cb_music")!=="off"}catch(e){}
const mf=m=>440*Math.pow(2,(m-69)/12),MINOR=[0,2,3,5,7,8,10],MAJOR=[0,2,4,5,7,9,11];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SONGS=[
 {name:"NEON CONFESSION",bpm:108,scale:MINOR,key:57,prog:[[57,"m"],[53,"M"],[60,"M"],[55,"M"]],
  kick:"x...x...x...x...",snare:"....x.......x...",hat:"..o...o...o...o.",bass:"0.0c0.0c0.0c0.0c",arp:"0120120120120121",lead:"saw",seed:11,dens:.36},
 {name:"CHROME RAIN",bpm:96,scale:MINOR,key:50,prog:[[50,"m"],[46,"M"],[55,"m"],[57,"M"]],
  kick:"x.....x...x.....",snare:"....x.......x..x",hat:"xxxxxxxxxxxxxxxx",bass:"0000000000000000",arp:"0..1..2..1..0..2",lead:"square",seed:23,dens:.3},
 {name:"MIDNIGHT ARITHMETIC",bpm:116,scale:MINOR,key:52,prog:[[52,"m"],[48,"M"],[55,"M"],[50,"M"],[52,"m"],[48,"M"],[57,"m"],[59,"M"]],
  kick:"x...x...x...x...",snare:"....c.......c...",hat:"x.x.x.x.x.x.x.x.",bass:"0..0..0.0..c..0.",arp:"0102010201020102",lead:"saw",seed:37,dens:.44}];
const SECRET={name:"HAPPYMEAT",bpm:152,scale:MAJOR,key:62,prog:[[62,"M"],[57,"M"],[59,"m"],[55,"M"],[55,"M"],[57,"M"],[62,"M"],[62,"M"]],
  lens:[16,16,16,14,16,16,14,16],kick:"x.x.x.x.x.x.x.x.",snare:"....x.......x...",hat:".x.x.x.x.x.x.x.x",bass:"0c0c0c0c0c0c0c0c",arp:"0120120120120120",lead:"bright",seed:7,dens:.6,happy:1};
const MU={out:null,del:null,rev:null,noise:null,timer:0,next:0,si:Math.floor(Math.random()*3),secret:false,bar:0,s:0,mel:null,bright:0,warp:0};
const SONG=()=>MU.secret?SECRET:SONGS[MU.si],SD=()=>60/SONG().bpm/4;
/* ---------- YOUR OWN MUSIC ----------
   Put audio files (mp3/ogg/wav) in a "music" folder next to this page and list them here, e.g.
     {name:"My Song",file:"music/my-song.mp3"}
   If this list is empty the built-in synth soundtrack plays. */
const TRACKS=[
  {name:"LIGHT",file:"music/light.ogg"},
  {name:"SEWNT",file:"music/sewnt.ogg"},
  {name:"VON",file:"music/von.ogg"},
];
const SONG_FROM_LEVEL=15,RARE0=.30,RARE_STEP=.05,RARE_MAX=.80,SONG_VOL=.3;   // synth is the normal soundtrack; from level 16 your songs get a 30% chance at each song change, +5% per level, up to 80%
let cMode=false,cForce=false;                  // cMode: custom songs are the current music; cForce: the SONGS button, always your songs (testing)
const rareChance=()=>st.level<SONG_FROM_LEVEL?0:Math.min(RARE_MAX,RARE0+RARE_STEP*(st.level-SONG_FROM_LEVEL));   // level 16 = 30%, 17 = 35% ... 26+ = 80%
const pickCustom=()=>cForce||Math.random()<rareChance();
const CUSTOM=()=>TRACKS.length>0&&!MU.secret&&cMode;
let ci=Math.floor(Math.random()*Math.max(1,TRACKS.length)),ca=null,cg=null,csrc=null,cOn=false;
/* ---------- audio analysis: visual beat matching + the level 16+ visualizer ---------- */
let an=null,FD=null;const MB={v:0,avg:0,last:0},KQ=[];             // MB.v = beat pulse (1 on a beat, fades out); KQ = scheduled synth kick times
function anLink(){
  if(!AC)return;
  if(!an){an=AC.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.4;an.minDecibels=-85;an.maxDecibels=-20;FD=new Uint8Array(an.frequencyBinCount)}
  if(MU.out&&!an._m){MU.out.connect(an);an._m=1}
  if(csrc&&!an._c){csrc.connect(an);an._c=1}}                       // tapped before the volume control, so quiet songs still move the bars
function audioFrame(t,dt){
  MB.v=Math.max(0,MB.v-dt*5);
  if(!MU.timer)KQ.length=0;
  else if(AC)while(KQ.length&&KQ[0]<=AC.currentTime){KQ.shift();MB.v=1}   // synth: the kick drum schedule is the beat
  if(an&&AC.state==="running"){an.getByteFrequencyData(FD);
    if(cOn){let e=0;for(let i=1;i<=5;i++)e+=FD[i];e/=5*255;           // your songs: bass-energy onset detection
      MB.avg=MB.avg*.94+e*.06;if(e>MB.avg*1.2&&e>.22&&t-MB.last>.17){MB.v=1;MB.last=t}}}}
function cInit(){
  if(ca)return true;

/* ---------- the hit: one function for the player, the AI and the serve ---------- */
function aiTrick(){                                            // the AI sometimes goes for a trick shot
  if(Math.random()>Math.min(.45,.02+.045*lvl()))return "";
  return ["BENDER","SLICE","SMASH","DROP"][Math.floor(Math.random()*4)]}
function strike(who,dx,dy,pvx,pvy,serve,trick){
  const s=lvl(),hz=HZ(),hot=Math.abs(dx)<hz&&Math.abs(dy)<hz,dir=who==="p"?1:-1;
  const gain=2.1*(1+0.025*s)*(hot?1.8:1);
  const curl=()=>hot?(Math.random()<.5?-1:1)*(1.1+0.05*s):0;    // a centre hit always adds some curve
  ball.hits=serve?0:(ball.hits||0)+1;                            // speed comes from the level, not from compounding every hit
  const sp=baseSpeed()*(1+Math.min(.18,.02*ball.hits))*(serve?1+Math.min(.15,Math.hypot(pvx,pvy)*.03):1);
  ball.vz=dir*sp*(hot?1.12:1);
  ball.vx=(serve?0:ball.vx)+dx*1.2+(serve?clamp(pvx,-2,2)*.25:0);
  ball.vy=(serve?0:ball.vy)+dy*1.2+(serve?clamp(pvy,-2,2)*.25:0);
  ball.sx=clamp(pvx*gain+curl(),-7,7);ball.sy=clamp(pvy*gain+curl(),-7,7);
  ball.fooled=false;
  if(MODE==="classic"&&who==="p"){                               // CLASSIC: swing in an arc for a drastic curve
    const a=arc5(),bend=Math.hypot(a.dx,a.dy);
    ball.sx=clamp(a.ax*gain*.4+a.dx*.8+curl()*.5,-8,8);ball.sy=clamp(a.ay*gain*.4+a.dy*.8+curl()*.5,-8,8);   // the bend still counts double, overall roughly half as strong
    if(bend>4&&!serve)flash("ARC SHOT  +CURVE","#ffb000");
    ball.fooled=st.level<8&&(Math.abs(ball.vz)>=0.56||Math.hypot(ball.vx,ball.vy)>=1.8||Math.hypot(ball.sx,ball.sy)>=6.5)}   // really fast ball, before level 9
  ball.z=who==="p"?0.0:1;
  ball.cork=who==="p"&&phased()?{R:.16*F,w:(pvx>=0?1:-1)*12,ph:0}:null;   // corkscrew: the ball spirals around its path
  rings.push({x:ball.x,y:ball.y,z:ball.z,t:0,hot});
  if(trick){
    const sg=Math.random()<.5?-1:1,sg2=Math.random()<.5?-1:1;
    if(trick==="BENDER"){ball.vx+=sg*1.3;ball.sx=-sg*5.5;ball.vy+=(Math.random()-.5)*1.2}   // starts one way, bends the other
    else if(trick==="SLICE"){ball.sx=sg*5.5;ball.sy=sg2*5.5}
    else if(trick==="SMASH"){ball.vz=-Math.min(1.25,Math.abs(ball.vz)*1.3);ball.sx*=.3;ball.sy*=.3}
    else if(trick==="DROP"){ball.vz*=.7;ball.sx=sg*5;ball.sy=sg2*4}
    flash("AI TRICK SHOT: "+trick,"#ff4455");tn(300,.2,"sawtooth",.06,900)}
  else if(hot){flash((who==="p"?"SWEET SPOT":"AI SWEET SPOT")+"  +CURVE +SPEED",who==="p"?"#ffb000":"#ff4455")}
  tink(hot);if(hot)pulse("rgba(255,176,0,.35)");
  if(MODE==="test"&&who==="p"&&hot&&!serve)stamina=Math.min(1,stamina+.75);
  if(ball.cork){flash("CORKSCREW","#33d6ff");tn(1400,.18,"sine",.04,500)}
  if(who==="p"){const nv=MODE!=="classic"&&RUN.sweet>=5?2.2:1;ai.off=[(Math.random()*2-1)*aimErr()*nv,(Math.random()*2-1)*aimErr()*nv];planAI();if(!serve)PSY.rally++}   // 5 sweet spots in a row: the AI aims badly
  if(!serve){
    RUN.vol++;RUN.spd=Math.max(RUN.spd,Math.hypot(ball.vx,ball.vy,ball.vz));
    if(who==="p"){
      if(hot){RUN.sweet++;if(RUN.sweet>RUN.bestSweet)RUN.bestSweet=RUN.sweet;if(RUN.sweet>SV.bestSweet)SV.bestSweet=RUN.sweet;
        if(MODE!=="classic"&&!trick){if(RUN.sweet===5)flash("FOCUS LOCK  -  THE AI IS RATTLED","#33d6ff");else if(RUN.sweet>=2&&RUN.sweet<5)flash("SWEET CHAIN x"+RUN.sweet,"#ffb000")}}
      else RUN.sweet=0}}
  spawnDecoys()}
function planAI(){                                             // fakes and erratic movement while the ball travels to the AI
  const p={type:"",z0:ball.z,ph:Math.random()*6.28,fx:0,fy:0,until:.45+Math.random()*.25};
  if(Math.random()<fakeP()){
    p.type=Math.random()<.5?"fake":"erratic";
    if(p.type==="fake"){p.fx=(ball.x>=0?-1:1)*(.5+Math.random()*.4)*F;p.fy=(Math.random()*2-1)*.6*F}}
  ai.plan=p}

let aiShape={kind:"rect",hold:4};
const SHAPES=["rect","tri","pent","hex","star","circle"];
function shapeVerts(kind,cx0,cy0,h){                             // regular polygon, in GAME space (not yet projected)
  const n={tri:3,pent:5,hex:6}[kind]||4,pts=[];
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;pts.push([cx0+Math.cos(a)*h,cy0+Math.sin(a)*h])}
  return pts}
function starVerts(cx0,cy0,h){
  const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?0.42:1;pts.push([cx0+Math.cos(a)*h*rr,cy0+Math.sin(a)*h*rr])}
  return pts}
function pointInPoly(px,py,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))inside=!inside}
  return inside}
function hitTest(shape,bx,by,cx0,cy0,h){                         // GEF MODE: a paddle's hitbox now matches its drawn shape
  if(!shape||shape==="rect")return Math.abs(bx-cx0)<h&&Math.abs(by-cy0)<h;
  if(shape==="circle")return Math.hypot(bx-cx0,by-cy0)<h*0.92;
  return pointInPoly(bx,by,shape==="star"?starVerts(cx0,cy0,h):shapeVerts(shape,cx0,cy0,h))}

function drawDMT(t,ins){                                        // a rushing, color-cycling tunnel of rings and spokes
  if(ins<=0)return;
  const R=Math.hypot(W,H)*0.6,rings=14,rot=t*(0.4+ins*1.2);
  ctx.save();ctx.globalCompositeOperation="lighter";ctx.translate(cx,cy);
  for(let i=0;i<rings;i++){
    const u=((i/rings)+t*0.25*(1+ins))%1,r=u*R,hue=(t*70+i*26)%360,sides=5+(i%4);
    ctx.save();ctx.rotate(rot*(i%2?1:-1)+i*0.3);
    ctx.strokeStyle="hsla("+hue+",100%,60%,"+(0.5*(1-u)*ins)+")";ctx.lineWidth=1.4+2*ins;
    ctx.beginPath();
    for(let k=0;k<=sides;k++){const a=k*2*Math.PI/sides,x=Math.cos(a)*r,y=Math.sin(a)*r*0.86;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.stroke();ctx.restore()}
  ctx.rotate(t*0.15);
  for(let k=0;k<24;k++){const a=k*Math.PI/12,hue=(t*90+k*15)%360;
    ctx.strokeStyle="hsla("+hue+",100%,65%,"+(0.12*ins)+")";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*R*0.1,Math.sin(a)*R*0.1*0.86);ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R*0.86);ctx.stroke()}
  ctx.restore()}

/* ---------- serve: swipe the paddle at the stationary ball ---------- */
function serveStep(){
  if(performance.now()<st.armAt)return;
  const dx=ball.x-pad.x,dy=ball.y-pad.y,h=(phased()?HZ():PHe())+BR,over=Math.abs(dx)<h&&Math.abs(dy)<h,d=Math.hypot(dx,dy);
  if(over){
    if(!ball.touch||d<ball.touch.d)ball.touch={d,dx,dy,vx:pad.vx,vy:pad.vy};   // remember the closest pass
    else if(d>ball.touch.d+0.015)doServe()}
  else if(ball.touch)doServe()}
function doServe(){
  const t=ball.touch;ball.touch=null;
  if(Math.hypot(t.vx,t.vy)<SERVE_MIN)return;                 // too gentle: not a swipe
  strike("p",t.dx,t.dy,t.vx,t.vy,true);ball.z=0.03;st.state="play";st.first=false;show("");maybeMultiball();
  if(MODE==="online"){ball.hot=Math.abs(t.dx)<HZ()&&Math.abs(t.dy)<HZ();netHit(true)}}

      if(wl>.05){ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]+wind.x*18,p[1]+wind.y*18);ctx.stroke()}}}
  paddle(0,pad.x,pad.y,TC.m,TC.l,t,phased()?"none":"rect");
  if(st.state==="play"&&ball.vz<0){const q=P(ball.x,ball.y,0),k=clamp(1-ball.z,0,1),r=BR*(A/F),
      pr=(phased()?HZ():PHe())+BR,on=Math.abs(ball.x-pad.x)<pr&&Math.abs(ball.y-pad.y)<pr;
    ctx.strokeStyle=rgb(on?mixc(TC.l,WHITE,.5):TC.w,.15+.55*k*k);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(q[0],q[1],r,0,7);ctx.moveTo(q[0]-r*1.6,q[1]);ctx.lineTo(q[0]-r*.6,q[1]);ctx.moveTo(q[0]+r*.6,q[1]);ctx.lineTo(q[0]+r*1.6,q[1]);
    ctx.moveTo(q[0],q[1]-r*1.6);ctx.lineTo(q[0],q[1]-r*.6);ctx.moveTo(q[0],q[1]+r*.6);ctx.lineTo(q[0],q[1]+r*1.6);ctx.stroke()}
  bursts.forEach(b=>drawBurst(b));
  rings.forEach(g=>{const p=P(g.x,g.y,g.z),k=g.t/.5;ctx.strokeStyle=rgb(g.hot?TC.a:TC.l,1-k);ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],BR*(A/F)*sc(g.z)*(1+k*(g.hot?5:3)),0,7);ctx.stroke()});
  ctx.restore();                                                   // end of the play field layer
  ctx.restore();
  bloom();
  if(lvl()>=34){invT-=dt;if(invT<=0){invA=.9;invT=5+Math.random()*8}}   // 35+: the colours invert without warning
  if(invA>0.02){ctx.save();ctx.globalCompositeOperation="difference";ctx.fillStyle="rgba(255,255,255,"+invA+")";ctx.fillRect(0,0,W,H);ctx.restore();invA=Math.max(0,invA-dt*2.5)}
  if(flashA>0.01){ctx.fillStyle="rgba(255,255,255,"+flashA*.55+")";ctx.fillRect(0,0,W,H)}
  const ins=insane();                                              // glitch: shifted slices of the screen
  if(ins>0&&glitchOn&&(frameN++%2===0)){
    const n=2+Math.floor(ins*5);
    for(let i=0;i<n;i++){const y=Math.random()*H,h=4+Math.random()*28*ins,dx=(Math.random()-.5)*70*ins;ctx.drawImage(cv,0,y,W,h,dx,y,W,h)}}
  if(MODE==="gef")drawGefGlitches(t);
  if(MODE==="test")drawStamina(t);
  if(MODE!=="classic")psyHud(t)}
function drawStamina(t){                                          // TEST MODE: small stamina meter, bottom-centre
  const w=250,h=9,x=(W-w)/2,y=H-34,low=stamina<.25,blink=Math.floor(t*8)%2===0;
  ctx.save();ctx.globalCompositeOperation="source-over";ctx.globalAlpha=.85;
  ctx.fillStyle="rgba(2,6,16,.5)";ctx.fillRect(x-6,y-5,w+12,h+22);
  ctx.strokeStyle="rgba(51,214,255,.45)";ctx.lineWidth=1;ctx.strokeRect(x-6,y-5,w+12,h+22);
  ctx.fillStyle=low?(blink?"#ff4455":"#5a0008"):"#33d6ff";ctx.fillRect(x,y,w*stamina,h);
  ctx.strokeStyle="rgba(191,255,213,.35)";ctx.strokeRect(x,y,w,h);
  ctx.font="9px "+UIF;ctx.textAlign="center";ctx.fillStyle="rgba(51,214,255,.9)";
  ctx.fillText("STAMINA "+Math.round(stamina*100)+(ball.caught?"  //  CAUGHT - RELEASE TO THROW":held&&stamina>.05?"  //  CATCH READY":"")+(shiftHeld?"  //  CORKSCREW ARMED":""),x+w/2,y+h+11);
  ctx.restore()}
let last=performance.now(),frameAll=0;
let errCount=0;
function frame(t){
  requestAnimationFrame(frame);                                  // always reschedule first: one bad frame must never kill the loop
  if(portraitBlock()){last=t;return}
  frameAll++;let dt=(t-last)/1000;last=t;if(!(dt>0))dt=0.016;dt=Math.min(0.033,dt);   // never negative / NaN after tab-away
  ctx.save();
  try{step(dt);draw(t/1000,dt)}
  catch(e){errCount++;if(errCount<4)console.warn("HELLBALL frame error",e);
    try{if(![ball.x,ball.y,ball.z,ball.vx,ball.vy,ball.vz,pad.x,pad.y].every(Number.isFinite)){pad.x=pad.tx=pad.y=pad.ty=0;toServe()}}catch(_){}}
  finally{ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";ctx.shadowBlur=0;ctx.setLineDash&&ctx.setLineDash([])}}
document.addEventListener("visibilitychange",()=>{last=performance.now()});
addEventListener("focus",()=>{last=performance.now()});

/* ---------- mobile / touch ---------- */
const COARSE=matchMedia("(pointer:coarse)");
function touchOn(){document.body.classList.add("touch")}
if(COARSE.matches||"ontouchstart" in window)touchOn();
addEventListener("pointerdown",e=>{if(e.pointerType==="touch")touchOn()},{passive:true});
const keyEv=(t,k)=>dispatchEvent(new KeyboardEvent(t,{key:k}));
document.getElementById("tbN").addEventListener("click",()=>{musicStart();keyEv("keydown","b")});
document.getElementById("tbF").addEventListener("click",()=>{keyEv("keydown","f")});
{const g=document.getElementById("tbG");g.addEventListener("pointerdown",e=>{e.preventDefault();keyEv("keydown","g")});
 g.addEventListener("pointerup",()=>keyEv("keyup","g"));g.addEventListener("pointercancel",()=>keyEv("keyup","g"))}
["gesturestart","gesturechange","gestureend","contextmenu"].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
addEventListener("orientationchange",()=>setTimeout(rs,250));
const portraitBlock=()=>COARSE.matches&&innerHeight>innerWidth;      // phones held upright: the game waits behind the rotate prompt
function touchPaddle(e,r){                                         // the paddle floats above your finger so it stays visible (no offset at the very bottom edge)
  const my=e.clientY-r.top,off=e.pointerType==="touch"?Math.min(56,Math.max(0,(r.height-my)*.6)):0;
  pad.mx=e.clientX-r.left;pad.my=my-off;padFromScreen();pad.tx=clamp(pad.rx,-padLim(),padLim());pad.ty=clamp(pad.ry,-padLim(),padLim())}
/* ---------- ONLINE 1V1: two players through a tiny relay (worker.js); inside Discord the room is the activity instance ---------- */
// Both players run this same code in their OWN frame: you are always at z=0, the opponent always at z=1.
// Every ball sent over the wire is flipped into the receiver's frame (x -> -x, z -> 1-z). Each player is the
// referee for their own end, so a hit is judged on the screen of the person making it - no lag on your own paddle.
// Between hits the flight is deterministic (fixed 120 Hz steps), so only hits and misses need to be sent.
const WIN_PTS=7,NSTEP=1/120,CODE_AB="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const net={ws:null,host:false,live:false,full:false,leaving:false,code:"",room:"",me:0,them:0,server:"me",lastLoser:"them",
  meReady:false,themReady:false,meRe:false,themRe:false,ox:0,oy:0,ovx:0,ovy:0,acc:0,rtt:120,padT:0,lastMsg:0};
const $=id=>document.getElementById(id);
const inDiscord=()=>/[?&]frame_id=/.test(location.search);
const baseURL=()=>location.href.split(/[?#]/)[0];
const inviteURL=()=>baseURL()+"#join="+net.code;
function newCode(){let s="";for(let i=0;i<5;i++)s+=CODE_AB[Math.floor(Math.random()*CODE_AB.length)];return s}
function netSend(m){if(net.ws&&net.ws.readyState===1)try{net.ws.send(JSON.stringify(m))}catch(e){}}
function lobby(o){                                               // o: {status, link, ready}
  $("modesel").classList.add("hidden");$("lobby").classList.remove("hidden");
  $("lbCode").textContent=inDiscord()?"":net.code;$("lbStatus").innerHTML=o.status;
  const link=!!o.link&&!inDiscord();["lbLink","lbCopy"].forEach(id=>$(id).classList.toggle("hidden",!link));if(link)$("lbLink").value=inviteURL();
  $("lbReady").classList.toggle("hidden",!o.ready)}
function waitMsg(){return inDiscord()?"WAITING FOR AN OPPONENT<br>ANYONE ELSE IN THIS ACTIVITY WHO PICKS 1V1 ONLINE LANDS RIGHT HERE."
  :"WAITING FOR AN OPPONENT<br>COPY THE INVITE LINK AND SEND IT. WHOEVER OPENS IT LANDS RIGHT HERE."}
function netOpen(code){                                          // code given = joining from an invite link
  MODE="online";st.state="lobby";net.full=false;net.leaving=false;net.live=false;show("");
  if(inDiscord()){const id=window.DISCORD_INSTANCE;if(!id){lobby({status:"STILL CONNECTING TO DISCORD...<br>TRY AGAIN IN A SECOND."});return}
    net.code="";net.room="dc-"+id}
  else{net.code=code||newCode();net.room="web-"+net.code}
  lobby({status:"CONNECTING..."});
  const url=(location.protocol==="https:"?"wss://":"ws://")+location.host+(inDiscord()?"/.proxy":"")+"/ws/"+encodeURIComponent(net.room);
  let ws;try{ws=net.ws=new WebSocket(url)}catch(e){lobby({status:"COULD NOT REACH THE GAME SERVER."});return}
  ws.onmessage=e=>{if(net.ws!==ws)return;let m;try{m=JSON.parse(e.data)}catch(_){return}
    net.lastMsg=performance.now();
    if(m.t==="wait"){net.host=true;lobby({status:waitMsg(),link:true})}
    else if(m.t==="peer"){net.host=!!m.host;net.live=true;net.meReady=net.themReady=false;
      lobby({status:"OPPONENT CONNECTED<br>CLICK READY WHEN YOU ARE.",ready:true})}
    else if(m.t==="left"){if(net.live)netLost()}
    else if(m.t==="full"){net.full=true;lobby({status:inDiscord()?"TWO PEOPLE IN THIS ACTIVITY ARE ALREADY PLAYING 1V1.<br>WAIT FOR THEIR MATCH TO END, THEN TRY AGAIN.":"THAT LOBBY ALREADY HAS TWO PLAYERS."})}
    else netMsg(m)};
  ws.onclose=()=>{if(net.ws!==ws)return;net.ws=null;const was=net.live;net.live=false;
    if(net.leaving||net.full||MODE!=="online")return;reset();balls=[];st.state="lobby";show("");
    lobby({status:(was?"CONNECTION LOST.":"COULD NOT REACH THE GAME SERVER.")+"<br>GO BACK TO THE MENU AND PICK 1V1 ONLINE TO TRY AGAIN."})}}
function netLeave(){net.leaving=true;netSend({t:"bye"});try{net.ws&&net.ws.close()}catch(e){}net.ws=null;net.live=false;$("lobby").classList.add("hidden")}
function netLost(){
  net.live=false;reset();balls=[];st.state="lobby";show("");hud();
  lobby({status:"YOUR OPPONENT LEFT.<br>"+waitMsg().split("<br>")[1],link:true})}
setInterval(()=>{if(!net.live)return;const n=performance.now();netSend({t:"ping",ts:n});   // a timer, not a frame: keeps going in a background tab
  if(n-net.lastMsg>10000)netLost()},1000);
addEventListener("pagehide",()=>{if(net.ws)netSend({t:"bye"})});   // closing the tab tells the other side right away
$("lbReady").addEventListener("click",()=>{musicStart();net.meReady=true;netSend({t:"ready"});
  lobby({status:"WAITING FOR YOUR OPPONENT TO READY UP..."});netMaybeStart()});
$("lbCopy").addEventListener("click",()=>{const u=inviteURL(),b=$("lbCopy"),done=()=>{b.textContent="COPIED - PASTE IT ANYWHERE";setTimeout(()=>b.textContent="COPY INVITE LINK",1800)},
    old=()=>{$("lbLink").select();try{document.execCommand("copy")}catch(e){}done()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(u).then(done,old);else old()});
$("lbLink").addEventListener("focus",e=>e.target.select());
$("lbBack").addEventListener("click",()=>{if(location.hash)history.replaceState(null,"",baseURL()+location.search);goMenu()});
$("mO").addEventListener("click",()=>{musicStart();netOpen()});
function netMaybeStart(){if(net.meReady&&net.themReady){net.meReady=net.themReady=false;netStart(net.host?"me":"them")}}
function netStart(server){                                       // fresh match: 3-2-1, then the first serve
  $("lobby").classList.add("hidden");net.me=net.them=0;net.meRe=net.themRe=false;st.level=0;st.score=0;balls=[];reset();syncField();
  st.state="count";hud();let n=3;
  const cd=()=>{if(st.state!=="count")return;
    if(n>0){show(String(n),"FIRST TO "+WIN_PTS+" - MOVE YOUR MOUSE TO AIM");tn(440,.1,"square",.05);n--;setTimeout(cd,700)}
    else{tn(880,.2,"square",.05);netServe(server)}};cd()}
function netServe(server){                                       // the player who just lost the point serves
  net.server=server;reset();if(server==="them")ball.z=0.97;
  st.state="serve";st.armAt=performance.now()+700;st.first=true;hud();
  show(server==="me"?"YOUR SERVE":"OPPONENT SERVES",server==="me"?"SWIPE THE PADDLE THROUGH THE BALL":"GET READY",true)}
function netHit(serve){const b=ball;
  netSend({t:"hit",serve,b:{x:b.x,y:b.y,z:b.z,vx:b.vx,vy:b.vy,vz:b.vz,sx:b.sx,sy:b.sy,hits:b.hits,hot:!!b.hot}})}
function netBall(h,quiet){                                       // one fixed physics step; true = stop stepping this frame
  if(ball.hold)return true;
  ball.vx+=ball.sx*h;ball.vy+=ball.sy*h;ball.x+=ball.vx*h;ball.y+=ball.vy*h;ball.z+=ball.vz*h;
  let bn=false;
  if(ball.x>F){ball.x=F;ball.vx=-ball.vx;bn=true}if(ball.x<-F){ball.x=-F;ball.vx=-ball.vx;bn=true}
  if(ball.y>F){ball.y=F;ball.vy=-ball.vy;bn=true}if(ball.y<-F){ball.y=-F;ball.vy=-ball.vy;bn=true}
  if(bn&&!quiet){bounceSnd();if(wa<.3)bflash.push({z:ball.z,t:0})}
  if(ball.z>=1&&ball.vz>0){ball.z=1;ball.hold=true;return true}  // their end: their screen decides, this one waits for the verdict
  if(ball.z<=0&&ball.vz<0){                                      // your end: your screen decides
    if(quiet)return true;
    const hh=PHe()+BR;
    if(Math.abs(ball.x-pad.x)<hh&&Math.abs(ball.y-pad.y)<hh){const hot=Math.abs(ball.x-pad.x)<HZ()&&Math.abs(ball.y-pad.y)<HZ();
      strike("p",ball.x-pad.x,ball.y-pad.y,pad.vx,pad.vy,false);ball.hot=hot;netHit(false)}
    else{ball.z=0;ball.hold=true;netSend({t:"miss"});netPoint("them")}
    return true}
  return false}
function netStep(dt){
  ai.x+=(net.ox-ai.x)*Math.min(1,dt*20);ai.y+=(net.oy-ai.y)*Math.min(1,dt*20);ai.vx=net.ovx;ai.vy=net.ovy;
  const n=performance.now();if(net.live&&n-net.padT>33){net.padT=n;netSend({t:"p",x:pad.x,y:pad.y,vx:pad.vx,vy:pad.vy})}
  if(st.state==="serve"){if(net.server==="me")serveStep();return}
  if(st.state!=="play")return;
  net.acc+=dt;while(net.acc>=NSTEP){net.acc-=NSTEP;if(netBall(NSTEP,false)){net.acc=0;break}}
  trail.push([ball.x,ball.y,ball.z]);if(trail.length>14)trail.shift()}
function netMsg(m){
  if(!m||!m.t)return;
  if(m.t==="ping")netSend({t:"pong",ts:m.ts});
  else if(m.t==="pong"){net.rtt=net.rtt*.7+(performance.now()-m.ts)*.3;hud()}
  else if(m.t==="p"){net.ox=-m.x;net.oy=m.y;net.ovx=-m.vx;net.ovy=m.vy}
  else if(m.t==="ready"){net.themReady=true;if(!net.meReady)lobby({status:"YOUR OPPONENT IS READY.<br>CLICK READY TO START.",ready:true});netMaybeStart()}
  else if(m.t==="hit"){
    if(st.state!=="play"&&st.state!=="serve"&&st.state!=="between")return;
    const b=m.b;Object.assign(ball,{x:-b.x,y:b.y,z:1-b.z,vx:-b.vx,vy:b.vy,vz:-b.vz,sx:-b.sx,sy:b.sy,hits:b.hits,hot:b.hot,hold:false,touch:null,cork:null});
    if(st.state!=="play"){st.state="play";show("")}
    rings.push({x:ball.x,y:ball.y,z:ball.z,t:0,hot:b.hot});tink(b.hot);if(b.hot)flash("OPPONENT SWEET SPOT  +CURVE +SPEED","#ff8f7e");
    net.acc=0;const ff=Math.min(.15,net.rtt/2000);              // catch up by the one-way trip, so both screens see the ball in the same place
    for(let t=0;t<ff;t+=NSTEP)if(netBall(NSTEP,true))break}
  else if(m.t==="miss"){if(st.state==="play"){burst(ball.x,ball.y,1);netPoint("me")}}
  else if(m.t==="rematch"){net.themRe=true;if(st.state==="over"&&!net.meRe)show(msg.firstChild.textContent,"YOUR OPPONENT WANTS A REMATCH - CLICK TO ACCEPT");netMaybeRematch()}
  else if(m.t==="bye"){if(net.live)netLost()}}
function netPoint(who){
  if(who==="me")net.me++;else net.them++;
  st.level=Math.min(8,net.me+net.them);                          // the field heats up as the match goes on (capped below the level-10 wall blast)
  if(who==="me"){pulse("rgba("+TL+",.35)");tn(660,.15,"square",.04);setTimeout(()=>tn(990,.25,"square",.04),120);flash("POINT   "+net.me+" - "+net.them,TLH)}
  else{pulse("rgba(255,143,126,.45)");tn(130,.4,"sawtooth",.07,60);flash("OPPONENT SCORES   "+net.me+" - "+net.them,"#ff8f7e");psyEvent("miss")}
  hud();
  if(net.me>=WIN_PTS||net.them>=WIN_PTS){
    const won=net.me>net.them;net.lastLoser=won?"them":"me";net.meRe=net.themRe=false;st.state="over";
    show(won?"YOU WIN":"YOU LOSE",net.me+" - "+net.them+"   CLICK FOR A REMATCH");
    if(won)[784,988,1175,1568].forEach((f,i)=>setTimeout(()=>tn(f,.18,"square",.045),i*90));return}
  st.state="between";setTimeout(()=>{if(st.state==="between")netServe(who==="me"?"them":"me")},900)}
function netClick(){if(st.state==="over"&&!net.meRe){net.meRe=true;netSend({t:"rematch"});
  show(msg.firstChild.textContent,"WAITING FOR YOUR OPPONENT...");netMaybeRematch()}}
function netMaybeRematch(){if(net.meRe&&net.themRe)netStart(net.lastLoser)}
function netHud(){$("s").textContent="1V1 ONLINE   YOU "+net.me+" - "+net.them+" OPP   FIRST TO "+WIN_PTS+(net.live?"   PING "+Math.round(net.rtt)+"MS":"")}
reset();hud();profInit();
{const j=location.hash.match(/join=([A-Z0-9]{5})(?![A-Z0-9])/i);if(j&&!inDiscord())netOpen(j[1].toUpperCase())}   // opened from an invite link: straight to the lobby
requestAnimationFrame(frame);
